[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retailpulse"
version = "0.1.0"
description = "Real-time Azure retail data platform with batch, streaming, observability and incident analysis"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<14",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.4,<3"]
analytics = [
  "dbt-core>=1.8,<1.10",
  "dbt-duckdb>=1.8,<1.10",
]
databricks = [
  "dbt-databricks>=1.9,<1.10",
  "databricks-sql-connector>=3.7,<4",
]
dashboard = [
  "pandas>=2.2,<3",
  "streamlit>=1.36,<2",
]
spark = [
  "delta-spark==4.0.0",
  "pyspark==4.0.4",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.5,<1",
  "sqlfluff>=3.1,<4",
]

[project.scripts]
retailpulse = "retailpulse.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/retailpulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Databricks injects these names into the notebook runtime.
"databricks/*.py" = ["F821"]
