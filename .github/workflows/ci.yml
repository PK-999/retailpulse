name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[dev,analytics,dashboard,databricks]'
      - run: ruff check src tests scripts dashboard databricks spark
      - run: python -m pytest --cov=retailpulse --cov-report=term-missing
      - run: python scripts/run_demo.py
      - run: dbt build --project-dir dbt --profiles-dir dbt
      - run: sqlfluff lint dbt/models dbt/tests --templater jinja

  bi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bi-dashboard/package-lock.json
      - run: npm ci
        working-directory: bi-dashboard
      - run: npm run lint
        working-directory: bi-dashboard
      - run: npm run build
        working-directory: bi-dashboard
      - run: npx playwright install --with-deps chromium
        working-directory: bi-dashboard
      - run: npm test
        working-directory: bi-dashboard

  spark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f tools/Dockerfile.spark -t retailpulse-spark-tests .
      - run: >-
          docker run --rm --network none
          --hostname localhost -e SPARK_LOCAL_IP=127.0.0.1
          -e PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
          -v "$PWD:/work:ro" -w /work
          retailpulse-spark-tests
          python -m pytest tests/test_spark_contract.py -p no:cacheprovider

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
      - run: terraform fmt -check -recursive terraform
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate
