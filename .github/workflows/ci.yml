name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[dev,analytics]'
      - run: ruff check src tests scripts dashboard databricks
      - run: pytest --cov=retailpulse --cov-report=term-missing
      - run: python scripts/run_demo.py
      - run: dbt build --project-dir dbt --profiles-dir dbt
      - run: sqlfluff lint dbt/models dbt/tests --templater jinja

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive terraform
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate
