name: retailpulse
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.12
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092", "9644:9644"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.53.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/metrics:/metrics:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    ports: ["9090:9090"]

  node-exporter:
    image: prom/node-exporter:v1.8.1
    command: ["--collector.textfile.directory=/metrics"]
    volumes:
      - ./data/metrics:/metrics:ro
    ports: ["9100:9100"]

  grafana:
    image: grafana/grafana:11.1.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: retailpulse
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

  ollama:
    image: ollama/ollama:0.3.6
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]

  dashboard:
    profiles: ["dashboard"]
    build: .
    environment:
      RETAILPULSE_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    ports: ["8501:8501"]

volumes:
  ollama:
