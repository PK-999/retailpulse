name: azure
purpose: Small, paid integration proof for Event Hubs, Azure Databricks, and ADLS.
execution:
  platform: azure
  broker: event_hubs
  processing: azure_databricks
  storage: adls_delta
  dbt_target: databricks
dataset:
  customers: 1000
  products: 250
  orders: 5000
  events: 25000
databricks:
  compute_mode: job
  trigger_mode: available_now
  max_runtime_minutes: 30
  interactive_auto_termination_minutes: 10
