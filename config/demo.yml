name: demo
purpose: Local performance rehearsal; Databricks Free Edition may be used for isolated experiments.
execution:
  platform: local
  broker: redpanda
  processing: pyspark_local
  storage: delta_local
  dbt_target: duckdb
dataset:
  customers: 100000
  products: 10000
  orders: 1000000
  events: 5000000
databricks:
  compute_mode: disabled
  trigger_mode: available_now
  max_runtime_minutes: 0
  interactive_auto_termination_minutes: 10
