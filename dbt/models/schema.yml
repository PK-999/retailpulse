version: 2

models:
  - name: stg_events
    columns:
      - name: event_id
        tests: [unique, not_null]
      - name: event_type
        tests:
          - not_null
          - accepted_values:
              values: ['product_view', 'search', 'add_to_cart', 'checkout', 'purchase', 'payment', 'inventory_update']
  - name: dim_customer
    columns:
      - name: customer_id
        tests: [unique, not_null]
  - name: dim_product
    columns:
      - name: product_id
        tests: [unique, not_null]
  - name: fact_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      - name: order_total
        tests: [not_null]
  - name: fact_order_items
    columns:
      - name: order_item_id
        tests: [unique, not_null]
      - name: product_id
        tests:
          - relationships:
              to: ref('dim_product')
              field: product_id
